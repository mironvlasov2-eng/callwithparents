<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Call With Parents - Прямое WebRTC соединение</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>👩‍👦 Call With Parents</h1>
      <p>Прямое WebRTC соединение</p>
    </header>

    <div class="main-content">
      <!-- Экран приветствия -->
      <div id="welcomeScreen" class="screen active">
        <div class="welcome-card">
          <h2>Добро пожаловать!</h2>
          <p>Создайте комнату или присоединитесь к существующей</p>
          
          <div class="action-buttons">
            <button id="createRoomBtn" class="btn btn-primary">
              📞 Создать комнату
            </button>
            <button id="joinRoomBtn" class="btn btn-secondary">
              🔗 Присоединиться
            </button>
          </div>

          <div id="joinForm" class="join-form hidden">
            <input id="roomIdInput" type="text" placeholder="Введите ID комнаты" />
            <button id="joinBtn" class="btn btn-primary">Присоединиться</button>
            <button id="cancelJoinBtn" class="btn btn-secondary">Отмена</button>
          </div>

          <div class="fallback-info">
            <p><small>Для работы нужен сигнальный сервер</small></p>
            <a href="index.html" class="btn btn-secondary" style="font-size: 0.9rem;">
              ← Вернуться к основной версии
            </a>
          </div>
        </div>
      </div>

      <!-- Экран видеозвонка -->
      <div id="callScreen" class="screen">
        <div class="video-container">
          <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-label">Участник</div>
          </div>
          
          <div class="video-wrapper local-video">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="video-label">Вы</div>
            <div class="video-controls">
              <button id="toggleVideo" class="control-btn" title="Включить/выключить видео">
                📹
              </button>
              <button id="toggleAudio" class="control-btn" title="Включить/выключить микрофон">
                🎤
              </button>
            </div>
          </div>
        </div>

        <div class="call-controls">
          <button id="endCallBtn" class="btn btn-danger">
            📞 Завершить звонок
          </button>
        </div>

        <div class="call-info">
          <p id="callStatus">Подключение...</p>
          <p id="roomIdDisplay"></p>
        </div>
      </div>
    </div>

    <!-- Уведомления -->
    <div id="notifications" class="notifications"></div>
  </div>

  <script>
    class DirectWebRTCApp {
      constructor() {
        this.localStream = null;
        this.peerConnection = null;
        this.signalingSocket = null;
        this.roomId = null;
        this.userId = null;
        this.isVideoEnabled = true;
        this.isAudioEnabled = true;
        
        // Настройки сигнального сервера
        this.signalingServer = 'ws://localhost:3000';
        
        this.initializeElements();
        this.bindEvents();
      }

      initializeElements() {
        // Screen elements
        this.welcomeScreen = document.getElementById('welcomeScreen');
        this.callScreen = document.getElementById('callScreen');
        
        // Video elements
        this.localVideo = document.getElementById('localVideo');
        this.remoteVideo = document.getElementById('remoteVideo');
        
        // Welcome screen elements
        this.createRoomBtn = document.getElementById('createRoomBtn');
        this.joinRoomBtn = document.getElementById('joinRoomBtn');
        this.joinForm = document.getElementById('joinForm');
        this.roomIdInput = document.getElementById('roomIdInput');
        this.joinBtn = document.getElementById('joinBtn');
        this.cancelJoinBtn = document.getElementById('cancelJoinBtn');
        
        // Call screen elements
        this.toggleVideoBtn = document.getElementById('toggleVideo');
        this.toggleAudioBtn = document.getElementById('toggleAudio');
        this.endCallBtn = document.getElementById('endCallBtn');
        this.callStatus = document.getElementById('callStatus');
        this.roomIdDisplay = document.getElementById('roomIdDisplay');
        
        // Notifications
        this.notifications = document.getElementById('notifications');
      }

      bindEvents() {
        // Welcome screen events
        this.createRoomBtn.addEventListener('click', () => this.createRoom());
        this.joinRoomBtn.addEventListener('click', () => this.showJoinForm());
        this.joinBtn.addEventListener('click', () => this.joinRoom());
        this.cancelJoinBtn.addEventListener('click', () => this.hideJoinForm());
        
        // Call screen events
        this.toggleVideoBtn.addEventListener('click', () => this.toggleVideo());
        this.toggleAudioBtn.addEventListener('click', () => this.toggleAudio());
        this.endCallBtn.addEventListener('click', () => this.endCall());
        
        // Room ID input
        this.roomIdInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') this.joinRoom();
        });
      }

      async createRoom() {
        try {
          await this.getUserMedia();
          this.roomId = this.generateRoomId();
          this.userId = this.generateUserId();
          this.roomIdDisplay.textContent = `ID комнаты: ${this.roomId}`;
          this.callStatus.textContent = 'Ожидание подключения...';
          this.showCallScreen();
          this.connectToSignalingServer();
          this.showNotification('Комната создана! Поделитесь ID с собеседником', 'success');
        } catch (error) {
          console.error('Failed to create room:', error);
          this.showNotification('Не удалось создать комнату', 'error');
        }
      }

      showJoinForm() {
        this.joinForm.classList.remove('hidden');
        this.joinRoomBtn.style.display = 'none';
      }

      hideJoinForm() {
        this.joinForm.classList.add('hidden');
        this.joinRoomBtn.style.display = 'inline-block';
        this.roomIdInput.value = '';
      }

      async joinRoom() {
        const roomId = this.roomIdInput.value.trim();
        if (!roomId) {
          this.showNotification('Введите ID комнаты', 'error');
          return;
        }

        try {
          await this.getUserMedia();
          this.roomId = roomId;
          this.userId = this.generateUserId();
          this.roomIdDisplay.textContent = `ID комнаты: ${this.roomId}`;
          this.callStatus.textContent = 'Подключение...';
          this.showCallScreen();
          this.connectToSignalingServer();
        } catch (error) {
          console.error('Failed to join room:', error);
          this.showNotification('Не удалось присоединиться к комнате', 'error');
        }
      }

      async getUserMedia() {
        if (!this.localStream) {
          try {
            this.localStream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: true
            });
            this.localVideo.srcObject = this.localStream;
            
            // Проверяем, что локальное видео работает
            this.localVideo.onloadedmetadata = () => {
              console.log('Локальное видео загружено');
              this.showNotification('Камера включена', 'success');
            };
            
            this.localVideo.onerror = (error) => {
              console.error('Ошибка локального видео:', error);
              this.showNotification('Ошибка камеры', 'error');
            };
            
            console.log('Локальный поток получен:', this.localStream);
            console.log('Видео треки:', this.localStream.getVideoTracks());
            console.log('Аудио треки:', this.localStream.getAudioTracks());
            
          } catch (error) {
            console.error('Failed to get user media:', error);
            this.showNotification('Не удалось получить доступ к камере и микрофону', 'error');
            throw error;
          }
        }
      }

      connectToSignalingServer() {
        try {
          this.signalingSocket = new WebSocket(`${this.signalingServer}?room=${this.roomId}&user=${this.userId}`);
          
          this.signalingSocket.onopen = () => {
            console.log('Подключение к сигнальному серверу установлено');
            this.showNotification('Подключение к серверу установлено', 'success');
          };
          
          this.signalingSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            this.handleSignalingMessage(data);
          };
          
          this.signalingSocket.onclose = () => {
            console.log('Соединение с сигнальным сервером закрыто');
            this.showNotification('Соединение с сервером потеряно', 'error');
          };
          
          this.signalingSocket.onerror = (error) => {
            console.error('Ошибка сигнального сервера:', error);
            this.showNotification('Ошибка подключения к серверу', 'error');
          };
          
        } catch (error) {
          console.error('Failed to connect to signaling server:', error);
          this.showNotification('Не удалось подключиться к сигнальному серверу', 'error');
        }
      }

      handleSignalingMessage(data) {
        switch (data.type) {
          case 'room-joined':
            console.log('Присоединение к комнате:', data);
            this.callStatus.textContent = 'В комнате, ожидание участников...';
            
            // Если мы одни в комнате, ждем других участников
            if (data.participants && data.participants.length === 1) {
              console.log('Мы одни в комнате, ждем других участников');
              this.callStatus.textContent = 'Ожидание других участников...';
            } else if (data.participants && data.participants.length === 2) {
              // Если в комнате уже 2 участника, значит мы присоединились к существующей комнате
              console.log('Присоединились к комнате с участниками, создаем соединение');
              this.createPeerConnection();
            }
            break;
            
          case 'user-joined':
            console.log('Новый участник:', data.userId);
            this.callStatus.textContent = 'Участник присоединился, установка соединения...';
            
            // Если это не мы, значит кто-то другой присоединился
            if (data.userId !== this.userId) {
              console.log('Кто-то другой присоединился, создаем соединение');
              this.callStatus.textContent = 'Участник присоединился, создаем соединение...';
              this.createPeerConnection();
            } else {
              // Если это мы присоединились, тоже создаем соединение
              console.log('Мы присоединились, создаем соединение');
              this.createPeerConnection();
            }
            break;
            
          case 'user-left':
            console.log('Участник покинул:', data.userId);
            this.handleCallEnd();
            break;
            
          case 'offer':
            this.handleOffer(data);
            break;
            
          case 'answer':
            this.handleAnswer(data);
            break;
            
          case 'ice-candidate':
            this.handleIceCandidate(data);
            break;
        }
      }

      async createPeerConnection() {
        const configuration = {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        };
        
        this.peerConnection = new RTCPeerConnection(configuration);
        
        // Добавляем локальный поток
        this.localStream.getTracks().forEach(track => {
          this.peerConnection.addTrack(track, this.localStream);
        });
        
        // Обработка входящих потоков
        this.peerConnection.ontrack = (event) => {
          console.log('Получен удаленный поток:', event);
          console.log('Streams:', event.streams);
          console.log('Track:', event.track);
          
          if (event.streams && event.streams[0]) {
            console.log('Устанавливаем удаленный поток в видео элемент');
            console.log('Удаленный поток содержит треки:', event.streams[0].getTracks());
            console.log('Видео треки в удаленном потоке:', event.streams[0].getVideoTracks());
            console.log('Аудио треки в удаленном потоке:', event.streams[0].getAudioTracks());
            
            // Проверяем и разглушаем видео треки
            const videoTracks = event.streams[0].getVideoTracks();
            if (videoTracks.length > 0) {
              console.log('Проверяем состояние видео трека:', videoTracks[0].muted);
              if (videoTracks[0].muted) {
                console.log('Видео трек заглушен, пробуем разглушить');
                videoTracks[0].enabled = true;
                
                // Пробуем создать новый поток из трека
                console.log('Создаем новый поток из заглушенного трека');
                const newStream = new MediaStream([videoTracks[0]]);
                this.remoteVideo.srcObject = newStream;
              }
            }
            
            this.remoteVideo.srcObject = event.streams[0];
            
            // Проверяем, что видео загрузилось
            this.remoteVideo.onloadedmetadata = () => {
              console.log('Удаленное видео загружено');
              this.callStatus.textContent = 'Соединение установлено';
              this.showNotification('Соединение установлено!', 'success');
            };
            
            this.remoteVideo.onerror = (error) => {
              console.error('Ошибка удаленного видео:', error);
              this.showNotification('Ошибка удаленного видео', 'error');
            };
            
            // Ждем загрузки метаданных перед воспроизведением
            this.remoteVideo.onloadedmetadata = () => {
              console.log('Метаданные удаленного видео загружены');
              this.remoteVideo.play().catch(error => {
                console.error('Ошибка воспроизведения удаленного видео:', error);
              });
            };
            
            // Дополнительная проверка через небольшую задержку
            setTimeout(() => {
              console.log('Проверка удаленного видео через 2 секунды:');
              console.log('- srcObject:', this.remoteVideo.srcObject);
              console.log('- readyState:', this.remoteVideo.readyState);
              console.log('- videoWidth:', this.remoteVideo.videoWidth);
              console.log('- videoHeight:', this.remoteVideo.videoHeight);
              console.log('- paused:', this.remoteVideo.paused);
              console.log('- currentTime:', this.remoteVideo.currentTime);
              
              if (this.remoteVideo.videoWidth === 0 && this.remoteVideo.videoHeight === 0) {
                console.log('Удаленное видео не отображается, пробуем другой подход');
                
                // Создаем новый видео элемент с правильными атрибутами
                const newVideo = document.createElement('video');
                newVideo.setAttribute('autoplay', 'true');
                newVideo.setAttribute('playsinline', 'true');
                newVideo.setAttribute('muted', 'false');
                newVideo.style.width = '100%';
                newVideo.style.height = '100%';
                newVideo.style.objectFit = 'cover';
                
                // Устанавливаем поток
                newVideo.srcObject = event.streams[0];
                
                // Добавляем обработчики
                newVideo.onloadedmetadata = () => {
                  console.log('Новый видео элемент: метаданные загружены');
                  newVideo.play().catch(e => console.error('Ошибка воспроизведения нового видео:', e));
                };
                
                newVideo.oncanplay = () => {
                  console.log('Новый видео элемент: готов к воспроизведению');
                };
                
                // Заменяем старый элемент
                this.remoteVideo.parentNode.replaceChild(newVideo, this.remoteVideo);
                this.remoteVideo = newVideo;
                
                console.log('Создан новый видео элемент для удаленного потока');
                
                // Принудительно запускаем воспроизведение через небольшую задержку
                setTimeout(() => {
                  if (newVideo.paused) {
                    console.log('Принудительно запускаем воспроизведение нового видео');
                    newVideo.play().catch(e => console.error('Ошибка принудительного воспроизведения:', e));
                  }
                }, 500);
                
                // Финальная проверка через 5 секунд
                setTimeout(() => {
                  console.log('Финальная проверка видео:');
                  console.log('- videoWidth:', newVideo.videoWidth);
                  console.log('- videoHeight:', newVideo.videoHeight);
                  console.log('- readyState:', newVideo.readyState);
                  console.log('- paused:', newVideo.paused);
                  
                  if (newVideo.videoWidth > 0 && newVideo.videoHeight > 0) {
                    console.log('✅ Видео успешно отображается!');
                  } else {
                    console.log('❌ Видео все еще не отображается');
                    console.log('Пробуем последний способ - прямой доступ к трекам');
                    
                    // Пробуем получить треки напрямую
                    const videoTracks = event.streams[0].getVideoTracks();
                    console.log('Видео треки:', videoTracks);
                    if (videoTracks.length > 0) {
                      console.log('Первый видео трек:', videoTracks[0]);
                      console.log('Трек активен:', videoTracks[0].enabled);
                      console.log('Трек готов:', videoTracks[0].readyState);
                      console.log('Трек заглушен:', videoTracks[0].muted);
                      
                      // Пробуем разглушить трек
                      if (videoTracks[0].muted) {
                        console.log('Пробуем разглушить видео трек');
                        videoTracks[0].enabled = true;
                        
                        // Пробуем создать новый поток из трека
                        console.log('Создаем новый поток из трека');
                        const newStream = new MediaStream([videoTracks[0]]);
                        newVideo.srcObject = newStream;
                        
                        // Пробуем принудительно запустить воспроизведение
                        newVideo.play().catch(e => console.error('Ошибка воспроизведения после разглушения:', e));
                      }
                    }
                  }
                }, 5000);
              }
            }, 2000);
            
          } else {
            console.error('Нет потоков в событии track');
            this.showNotification('Ошибка: нет видео потока', 'error');
          }
        };
        
        // Обработка ICE кандидатов
        this.peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            console.log('Отправляем ICE candidate:', event.candidate);
            this.sendSignalingMessage({
              type: 'ice-candidate',
              candidate: event.candidate
            });
          }
        };
        
        // Отслеживание состояния соединения
        this.peerConnection.onconnectionstatechange = () => {
          console.log('Состояние соединения:', this.peerConnection.connectionState);
          this.callStatus.textContent = `Соединение: ${this.peerConnection.connectionState}`;
          
          if (this.peerConnection.connectionState === 'connected') {
            console.log('WebRTC соединение установлено!');
            this.showNotification('WebRTC соединение установлено!', 'success');
          }
        };
        
        this.peerConnection.oniceconnectionstatechange = () => {
          console.log('ICE состояние:', this.peerConnection.iceConnectionState);
          
          if (this.peerConnection.iceConnectionState === 'connected') {
            console.log('ICE соединение установлено!');
            // Проверяем состояние видео элементов
            console.log('Локальное видео srcObject:', this.localVideo.srcObject);
            console.log('Удаленное видео srcObject:', this.remoteVideo.srcObject);
            console.log('Удаленное видео readyState:', this.remoteVideo.readyState);
            console.log('Удаленное видео paused:', this.remoteVideo.paused);
          }
        };
        
        // Создаем offer
        const offer = await this.peerConnection.createOffer();
        await this.peerConnection.setLocalDescription(offer);
        
        this.sendSignalingMessage({
          type: 'offer',
          offer: offer
        });
      }

      async handleOffer(data) {
        console.log('Получен offer от:', data.from);
        
        if (!this.peerConnection) {
          await this.createPeerConnection();
        }
        
        // Простая логика - всегда обрабатываем offer
        console.log('Обрабатываем offer, состояние:', this.peerConnection.signalingState);
        
        try {
          await this.peerConnection.setRemoteDescription(data.offer);
          
          // Добавляем отложенные ICE кандидаты
          if (this.pendingIceCandidates && this.pendingIceCandidates.length > 0) {
            console.log('Добавляем отложенные ICE кандидаты:', this.pendingIceCandidates.length);
            for (const candidate of this.pendingIceCandidates) {
              try {
                await this.peerConnection.addIceCandidate(candidate);
              } catch (error) {
                console.error('Ошибка добавления отложенного ICE candidate:', error);
              }
            }
            this.pendingIceCandidates = [];
          }
          
          console.log('Создаем answer');
          const answer = await this.peerConnection.createAnswer();
          await this.peerConnection.setLocalDescription(answer);
          
          console.log('Отправляем answer');
          this.sendSignalingMessage({
            type: 'answer',
            answer: answer
          });
          
        } catch (error) {
          console.error('Ошибка обработки offer:', error);
          // Если ошибка, создаем новое соединение
          this.peerConnection.close();
          this.peerConnection = null;
          await this.createPeerConnection();
          await this.peerConnection.setRemoteDescription(data.offer);
          
          const answer = await this.peerConnection.createAnswer();
          await this.peerConnection.setLocalDescription(answer);
          
          this.sendSignalingMessage({
            type: 'answer',
            answer: answer
          });
        }
      }

      async handleAnswer(data) {
        console.log('Получен answer от:', data.from);
        
        if (this.peerConnection && this.peerConnection.signalingState === 'have-local-offer') {
          console.log('Устанавливаем remote description для answer');
          await this.peerConnection.setRemoteDescription(data.answer);
          
          // Добавляем отложенные ICE кандидаты
          if (this.pendingIceCandidates && this.pendingIceCandidates.length > 0) {
            console.log('Добавляем отложенные ICE кандидаты после answer:', this.pendingIceCandidates.length);
            for (const candidate of this.pendingIceCandidates) {
              try {
                await this.peerConnection.addIceCandidate(candidate);
              } catch (error) {
                console.error('Ошибка добавления отложенного ICE candidate:', error);
              }
            }
            this.pendingIceCandidates = [];
          }
        } else if (!this.peerConnection) {
          console.log('Получили answer, но у нас нет соединения, создаем новое');
          await this.createPeerConnection();
          await this.peerConnection.setRemoteDescription(data.answer);
        } else {
          console.log('Пропускаем answer, неподходящее состояние:', this.peerConnection?.signalingState);
        }
      }

      async handleIceCandidate(data) {
        if (this.peerConnection) {
          // Проверяем, что remote description установлен
          if (this.peerConnection.remoteDescription) {
            try {
              await this.peerConnection.addIceCandidate(data.candidate);
              console.log('ICE candidate добавлен успешно');
            } catch (error) {
              console.error('Ошибка добавления ICE candidate:', error);
            }
          } else {
            console.log('Откладываем ICE candidate, remote description не установлен');
            // Сохраняем кандидата для добавления позже
            if (!this.pendingIceCandidates) {
              this.pendingIceCandidates = [];
            }
            this.pendingIceCandidates.push(data.candidate);
          }
        }
      }

      sendSignalingMessage(message) {
        if (this.signalingSocket && this.signalingSocket.readyState === WebSocket.OPEN) {
          this.signalingSocket.send(JSON.stringify(message));
        }
      }

      toggleVideo() {
        if (this.localStream) {
          const videoTrack = this.localStream.getVideoTracks()[0];
          if (videoTrack) {
            videoTrack.enabled = !videoTrack.enabled;
            this.isVideoEnabled = videoTrack.enabled;
            this.toggleVideoBtn.textContent = this.isVideoEnabled ? '📹' : '📹';
            this.toggleVideoBtn.classList.toggle('muted', !this.isVideoEnabled);
          }
        }
      }

      toggleAudio() {
        if (this.localStream) {
          const audioTrack = this.localStream.getAudioTracks()[0];
          if (audioTrack) {
            audioTrack.enabled = !audioTrack.enabled;
            this.isAudioEnabled = audioTrack.enabled;
            this.toggleAudioBtn.textContent = this.isAudioEnabled ? '🎤' : '🎤';
            this.toggleAudioBtn.classList.toggle('muted', !this.isAudioEnabled);
          }
        }
      }

      endCall() {
        if (this.signalingSocket) {
          this.signalingSocket.close();
        }
        this.handleCallEnd();
      }

      handleCallEnd() {
        if (this.peerConnection) {
          this.peerConnection.close();
          this.peerConnection = null;
        }
        this.remoteVideo.srcObject = null;
        this.showWelcomeScreen();
        this.showNotification('Звонок завершен', 'success');
      }

      showWelcomeScreen() {
        this.welcomeScreen.classList.add('active');
        this.callScreen.classList.remove('active');
        this.hideJoinForm();
      }

      showCallScreen() {
        this.welcomeScreen.classList.remove('active');
        this.callScreen.classList.add('active');
      }

      showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.textContent = message;
        
        this.notifications.appendChild(notification);
        
        setTimeout(() => {
          if (notification.parentNode) {
            notification.parentNode.removeChild(notification);
          }
        }, 5000);
      }

      generateRoomId() {
        return Math.random().toString(36).substr(2, 9);
      }

      generateUserId() {
        return Math.random().toString(36).substr(2, 9);
      }
    }

    // Инициализируем приложение
    document.addEventListener('DOMContentLoaded', () => {
      new DirectWebRTCApp();
    });
  </script>
</body>
</html>
