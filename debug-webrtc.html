<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debug WebRTC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .video-container { display: flex; gap: 20px; margin: 20px 0; }
    video { width: 300px; height: 200px; border: 2px solid #ccc; }
    .status { background: #f0f0f0; padding: 10px; margin: 10px 0; }
    button { padding: 10px 20px; margin: 5px; }
  </style>
</head>
<body>
  <h1>🔍 Debug WebRTC</h1>
  
  <div class="status" id="status">Готов к тестированию</div>
  
  <div class="video-container">
    <div>
      <h3>Локальное видео</h3>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div>
      <h3>Удаленное видео</h3>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>
  
  <div>
    <button id="startBtn">🎥 Включить камеру</button>
    <button id="testBtn">🧪 Тест WebRTC</button>
    <button id="connectBtn">🔗 Подключиться</button>
  </div>
  
  <div id="logs" style="background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: scroll; font-family: monospace;"></div>

  <script>
    class DebugWebRTC {
      constructor() {
        this.localStream = null;
        this.peerConnection = null;
        this.signalingSocket = null;
        this.roomId = 'debug-room';
        this.userId = 'user-' + Math.random().toString(36).substr(2, 9);
        
        this.initializeElements();
        this.bindEvents();
      }

      initializeElements() {
        this.localVideo = document.getElementById('localVideo');
        this.remoteVideo = document.getElementById('remoteVideo');
        this.status = document.getElementById('status');
        this.logs = document.getElementById('logs');
        this.startBtn = document.getElementById('startBtn');
        this.testBtn = document.getElementById('testBtn');
        this.connectBtn = document.getElementById('connectBtn');
      }

      bindEvents() {
        this.startBtn.addEventListener('click', () => this.startCamera());
        this.testBtn.addEventListener('click', () => this.testWebRTC());
        this.connectBtn.addEventListener('click', () => this.connectToSignaling());
      }

      log(message) {
        const timestamp = new Date().toLocaleTimeString();
        this.logs.innerHTML += `[${timestamp}] ${message}<br>`;
        this.logs.scrollTop = this.logs.scrollHeight;
        console.log(message);
      }

      async startCamera() {
        try {
          this.log('Запрашиваем доступ к камере...');
          this.localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });
          
          this.localVideo.srcObject = this.localStream;
          this.log('Камера включена успешно');
          this.status.textContent = 'Камера включена';
          
        } catch (error) {
          this.log('Ошибка камеры: ' + error.message);
          this.status.textContent = 'Ошибка камеры';
        }
      }

      async testWebRTC() {
        try {
          this.log('Тестируем WebRTC соединение...');
          
          const configuration = {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          };
          
          this.peerConnection = new RTCPeerConnection(configuration);
          
          // Добавляем локальный поток
          if (this.localStream) {
            this.localStream.getTracks().forEach(track => {
              this.peerConnection.addTrack(track, this.localStream);
              this.log(`Добавлен трек: ${track.kind}`);
            });
          }
          
          // Обработка входящих потоков
          this.peerConnection.ontrack = (event) => {
            this.log('Получен удаленный поток!');
            this.remoteVideo.srcObject = event.streams[0];
            this.log('Удаленное видео установлено');
          };
          
          // Обработка ICE кандидатов
          this.peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
              this.log('ICE кандидат: ' + event.candidate.candidate);
            }
          };
          
          // Создаем offer
          const offer = await this.peerConnection.createOffer();
          await this.peerConnection.setLocalDescription(offer);
          
          this.log('Offer создан: ' + offer.type);
          this.status.textContent = 'WebRTC тест завершен';
          
        } catch (error) {
          this.log('Ошибка WebRTC: ' + error.message);
          this.status.textContent = 'Ошибка WebRTC';
        }
      }

      connectToSignaling() {
        try {
          this.log('Подключаемся к сигнальному серверу...');
          
          this.signalingSocket = new WebSocket(`ws://localhost:3000?room=${this.roomId}&user=${this.userId}`);
          
          this.signalingSocket.onopen = () => {
            this.log('Подключение к серверу установлено');
            this.status.textContent = 'Подключен к серверу';
          };
          
          this.signalingSocket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            this.log('Получено сообщение: ' + data.type);
            
            if (data.type === 'room-joined') {
              this.log('Присоединились к комнате: ' + data.room);
            }
          };
          
          this.signalingSocket.onclose = () => {
            this.log('Соединение с сервером закрыто');
          };
          
          this.signalingSocket.onerror = (error) => {
            this.log('Ошибка WebSocket: ' + error);
          };
          
        } catch (error) {
          this.log('Ошибка подключения: ' + error.message);
        }
      }
    }

    // Инициализируем приложение
    document.addEventListener('DOMContentLoaded', () => {
      new DebugWebRTC();
    });
  </script>
</body>
</html>
