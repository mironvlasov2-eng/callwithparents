<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call With Parents - Видеозвонок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }
        
        .call-container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
        
        .local-video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 12px;
            border: 2px solid #ff6b35;
            object-fit: cover;
            background: #000;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
        }
        
        .local-video:hover {
            transform: scale(1.05);
            border-color: #ff6b35;
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.5);
        }
        
        .controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 30px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(20px);
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 53, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.15), rgba(255, 107, 53, 0.05));
            color: #ff6b35;
            position: relative;
            overflow: hidden;
        }
        
        .control-btn svg {
            transition: all 0.3s ease;
        }
        
        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), transparent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .control-btn:hover::before {
            opacity: 1;
        }
        
        .control-btn:active {
            transform: scale(0.95);
        }
        
        .control-btn.active {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.4), rgba(255, 107, 53, 0.2));
            border-color: #ff6b35;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }
        
        .control-btn:hover {
            transform: scale(1.1);
            border-color: #ff6b35;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.3), rgba(255, 107, 53, 0.1));
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
            color: #ffffff;
        }
        
        .control-btn:hover svg {
            transform: scale(1.1);
        }
        
        .mute-btn.muted {
            background: linear-gradient(135deg, #ff4444, #ff6666);
            border-color: #ff4444;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }
        
        .video-btn.disabled {
            background: linear-gradient(135deg, #ff4444, #ff6666);
            border-color: #ff4444;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }
        
        .end-call-btn {
            background: linear-gradient(135deg, #ff4444, #ff6666);
            border-color: #ff4444;
            color: white;
            width: 70px;
            height: 70px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }
        
        .end-call-btn:hover {
            background: linear-gradient(135deg, #ff3333, #ff5555);
            border-color: #ff3333;
            box-shadow: 0 8px 25px rgba(255, 68, 68, 0.4);
            transform: scale(1.1);
        }
        
        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px 20px;
            border-radius: 25px;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b35;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.connecting {
            background: #ff9800;
        }
        
        .status-indicator.error {
            background: #ff4444;
            animation: none;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .connection-info {
            position: absolute;
            top: 20px;
            right: 240px;
            background: rgba(0, 0, 0, 0.9);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            font-size: 14px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2a2a2a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .welcome-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .welcome-content h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b35, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-content p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .join-section {
            margin-top: 20px;
        }
        
        .room-id-container {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .room-id-container input {
            flex: 1;
        }
        
        .btn-copy {
            background: linear-gradient(135deg, #ff6b35, #ff8c42);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }
        
        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6);
        }
        
        .btn-copy:active {
            transform: translateY(0);
        }
        
        .btn {
            background: linear-gradient(45deg, #ff6b35, #ff8c42);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }
        
        .btn:hover {
            background: linear-gradient(45deg, #ff8c42, #ff6b35);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ff6b35;
        }
        
        .input-group {
            margin: 20px 0;
        }
        
        .input-group input {
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            font-size: 16px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.3);
        }
        
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(20px);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            border-left: 4px solid #ff6b35;
        }
        
        .notification.error {
            border-left: 4px solid #ff4444;
        }
        
        .notification.info {
            border-left: 4px solid #ff6b35;
        }
        
        @media (max-width: 768px) {
            .local-video {
                width: 120px;
                height: 90px;
                top: 10px;
                right: 10px;
            }
            
            .controls-panel {
                padding: 20px 10px 10px;
                gap: 15px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
            }
            
            .control-btn svg {
                width: 16px;
                height: 16px;
            }
            
            .end-call-btn {
                width: 60px;
                height: 60px;
            }
            
            .end-call-btn svg {
                width: 18px;
                height: 18px;
            }
            
            .status-bar {
                top: 10px;
                left: 10px;
                padding: 10px 15px;
            }
            
            .connection-info {
                top: 10px;
                right: 140px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="call-container">
        <!-- Видео контейнер -->
        <div class="video-container">
            <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
            <video id="localVideo" class="local-video" autoplay muted playsinline></video>
        </div>
        
        <!-- Статус бар -->
        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Подключение...</span>
        </div>
        
        <!-- Информация о соединении -->
        <div class="connection-info" id="connectionInfo" style="display: none;">
            <span id="connectionText"></span>
        </div>
        
        <!-- Панель управления -->
        <div class="controls-panel">
            <button class="control-btn mute-btn" id="muteBtn" title="Включить/выключить микрофон">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                </svg>
            </button>
            <button class="control-btn video-btn" id="videoBtn" title="Включить/выключить камеру">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
            </button>
            <button class="control-btn end-call-btn" id="endCallBtn" title="Завершить звонок">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Экран приветствия -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
            <h1>Позвонить родителям</h1>
            
            <div class="action-buttons">
                <button class="btn" id="createRoomBtn">Создать комнату</button>
                <button class="btn btn-secondary" id="joinRoomBtn">Присоединиться к комнате</button>
            </div>
            
            <div class="join-section" id="joinSection" style="display: none;">
                <div class="input-group">
                    <input type="text" id="peerIdInput" placeholder="Введите ID комнаты">
                </div>
                <button class="btn" id="startCallBtn">Присоединиться</button>
            </div>
            
            <div id="myIdDisplay" style="display: none; margin-top: 20px;">
                <p><strong>Ваш ID:</strong></p>
                <div class="room-id-container">
                    <input type="text" id="myId" readonly style="font-family: monospace; font-size: 18px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,107,53,0.3); color: white; width: 100%; margin-bottom: 10px;">
                    <button class="btn-copy" id="copyRoomIdBtn" style="background: linear-gradient(135deg, #ff6b35, #ff8c42); border: none; color: white; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 16px;">📋 Копировать</button>
                </div>
                <p style="font-size: 14px; opacity: 0.8; margin-top: 10px;">Поделитесь этим ID с другим участником</p>
            </div>
        </div>
    </div>
    
    <!-- Уведомления -->
    <div class="notification" id="notification"></div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        class VideoCallApp {
            constructor() {
                this.localStream = null;
                this.peer = null;
                this.connection = null;
                this.isMuted = false;
                this.isVideoEnabled = true;
                this.isConnected = false;
                
                // Элементы интерфейса
                this.welcomeScreen = document.getElementById('welcomeScreen');
                this.localVideo = document.getElementById('localVideo');
                this.remoteVideo = document.getElementById('remoteVideo');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.connectionInfo = document.getElementById('connectionInfo');
                this.connectionText = document.getElementById('connectionText');
                this.muteBtn = document.getElementById('muteBtn');
                this.videoBtn = document.getElementById('videoBtn');
                this.endCallBtn = document.getElementById('endCallBtn');
                this.peerIdInput = document.getElementById('peerIdInput');
                this.myIdDisplay = document.getElementById('myIdDisplay');
                this.myId = document.getElementById('myId');
                this.notification = document.getElementById('notification');
                
                // Кнопки
                this.startCallBtn = document.getElementById('startCallBtn');
                this.createRoomBtn = document.getElementById('createRoomBtn');
                this.joinRoomBtn = document.getElementById('joinRoomBtn');
                this.copyRoomIdBtn = document.getElementById('copyRoomIdBtn');
                this.joinSection = document.getElementById('joinSection');
                
                this.initializeEventListeners();
            }
            
            initializeEventListeners() {
                this.startCallBtn.onclick = () => this.startCall();
                this.createRoomBtn.onclick = () => this.createRoom();
                this.joinRoomBtn.onclick = () => this.showJoinSection();
                this.copyRoomIdBtn.onclick = () => this.copyRoomId();
                this.muteBtn.onclick = () => this.toggleMute();
                this.videoBtn.onclick = () => this.toggleVideo();
                this.endCallBtn.onclick = () => this.endCall();
                
                // Enter для подключения
                this.peerIdInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.startCall();
                    }
                });
            }
            
            async createRoom() {
                try {
                    this.updateStatus('connecting', 'Создание комнаты...');
                    
                    // Получаем доступ к камере
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                    
                    this.localVideo.srcObject = this.localStream;
                    
                    // Создаем PeerJS соединение с TURN серверами для международных соединений
                    const peerConfig = {
                        config: {
                            iceServers: [
                                // STUN серверы
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' },
                                { urls: 'stun:stun2.l.google.com:19302' },
                                { urls: 'stun:stun3.l.google.com:19302' },
                                { urls: 'stun:stun4.l.google.com:19302' },
                                { urls: 'stun:stun.ekiga.net' },
                                { urls: 'stun:stun.ideasip.com' },
                                { urls: 'stun:stun.schlund.de' },
                                { urls: 'stun:stun.stunprotocol.org:3478' },
                                { urls: 'stun:stun.voiparound.com' },
                                { urls: 'stun:stun.voipbuster.com' },
                                { urls: 'stun:stun.voipstunt.com' },
                                { urls: 'stun:stun.counterpath.com' },
                                { urls: 'stun:stun.1und1.de' },
                                { urls: 'stun:stun.gmx.net' },
                                { urls: 'stun:stun.callwithus.com' },
                                { urls: 'stun:stun.internetcalls.com' },
                                // TURN серверы для международных соединений
                                { 
                                    urls: 'turn:openrelay.metered.ca:80',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:443',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:80?transport=tcp',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                }
                            ]
                        }
                    };
                    
                    this.peer = new Peer(peerConfig);
                    
                    this.peer.on('open', (id) => {
                        this.myId.value = id;
                        this.myIdDisplay.style.display = 'block';
                        this.updateStatus('connected', 'Комната создана!');
                        this.showNotification('Комната создана! Скопируйте ID и поделитесь им', 'success');
                    });
                    
                    this.peer.on('call', (call) => {
                        this.updateStatus('connecting', 'Входящий звонок...');
                        call.answer(this.localStream);
                        this.connection = call;
                        this.setupConnectionHandlers();
                    });
                    
                    this.peer.on('error', (error) => {
                        console.error('PeerJS ошибка:', error);
                        this.updateStatus('error', 'Ошибка соединения');
                        this.showNotification('Ошибка: ' + error.message, 'error');
                    });
                    
                } catch (error) {
                    console.error('Ошибка создания комнаты:', error);
                    this.updateStatus('error', 'Ошибка доступа к камере');
                    this.showNotification('Ошибка доступа к камере: ' + error.message, 'error');
                }
            }
            
            showJoinSection() {
                this.joinSection.style.display = 'block';
                this.createRoomBtn.style.display = 'none';
                this.joinRoomBtn.style.display = 'none';
            }
            
            copyRoomId() {
                const roomId = this.myId.value;
                if (roomId) {
                    navigator.clipboard.writeText(roomId).then(() => {
                        this.showNotification('ID скопирован в буфер обмена!', 'success');
                    }).catch(() => {
                        // Fallback для старых браузеров
                        this.myId.select();
                        document.execCommand('copy');
                        this.showNotification('ID скопирован!', 'success');
                    });
                }
            }
            
            async startCall() {
                const peerId = this.peerIdInput.value.trim();
                if (!peerId) {
                    this.showNotification('Введите ID участника!', 'error');
                    return;
                }
                
                try {
                    this.updateStatus('connecting', 'Подключение к участнику...');
                    
                    // Получаем доступ к камере
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                    
                    this.localVideo.srcObject = this.localStream;
                    
                    // Создаем PeerJS соединение с TURN серверами для международных соединений
                    const peerConfig = {
                        config: {
                            iceServers: [
                                // STUN серверы
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' },
                                { urls: 'stun:stun2.l.google.com:19302' },
                                { urls: 'stun:stun3.l.google.com:19302' },
                                { urls: 'stun:stun4.l.google.com:19302' },
                                { urls: 'stun:stun.ekiga.net' },
                                { urls: 'stun:stun.ideasip.com' },
                                { urls: 'stun:stun.schlund.de' },
                                { urls: 'stun:stun.stunprotocol.org:3478' },
                                { urls: 'stun:stun.voiparound.com' },
                                { urls: 'stun:stun.voipbuster.com' },
                                { urls: 'stun:stun.voipstunt.com' },
                                { urls: 'stun:stun.counterpath.com' },
                                { urls: 'stun:stun.1und1.de' },
                                { urls: 'stun:stun.gmx.net' },
                                { urls: 'stun:stun.callwithus.com' },
                                { urls: 'stun:stun.internetcalls.com' },
                                // TURN серверы для международных соединений
                                { 
                                    urls: 'turn:openrelay.metered.ca:80',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:443',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:443?transport=tcp',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                },
                                { 
                                    urls: 'turn:openrelay.metered.ca:80?transport=tcp',
                                    username: 'openrelayproject',
                                    credential: 'openrelayproject'
                                }
                            ]
                        }
                    };
                    
                    this.peer = new Peer(peerConfig);
                    
                    this.peer.on('open', (id) => {
                        this.updateStatus('connecting', 'Подключение...');
                        this.connection = this.peer.call(peerId, this.localStream);
                        this.setupConnectionHandlers();
                    });
                    
                    this.peer.on('error', (error) => {
                        console.error('PeerJS ошибка:', error);
                        this.updateStatus('error', 'Ошибка соединения');
                        this.showNotification('Ошибка: ' + error.message, 'error');
                    });
                    
                } catch (error) {
                    console.error('Ошибка подключения:', error);
                    this.updateStatus('error', 'Ошибка доступа к камере');
                    this.showNotification('Ошибка доступа к камере: ' + error.message, 'error');
                }
            }
            
            setupConnectionHandlers() {
                this.connection.on('stream', (remoteStream) => {
                    this.remoteVideo.srcObject = remoteStream;
                    this.isConnected = true;
                    this.updateStatus('connected', 'Соединение установлено');
                    this.showNotification('Соединение установлено!', 'success');
                    this.hideWelcomeScreen();
                });
                
                this.connection.on('close', () => {
                    this.isConnected = false;
                    this.updateStatus('error', 'Соединение потеряно');
                    this.showNotification('Соединение потеряно', 'error');
                });
                
                this.connection.on('error', (error) => {
                    console.error('Ошибка соединения:', error);
                    this.updateStatus('error', 'Ошибка соединения');
                    this.showNotification('Ошибка соединения: ' + error.message, 'error');
                });
            }
            
            toggleMute() {
                if (this.localStream) {
                    const audioTrack = this.localStream.getAudioTracks()[0];
                    if (audioTrack) {
                        audioTrack.enabled = !audioTrack.enabled;
                        this.isMuted = !audioTrack.enabled;
                        this.muteBtn.classList.toggle('muted', this.isMuted);
                        // Обновляем иконку микрофона
                        if (this.isMuted) {
                            this.muteBtn.innerHTML = `
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/>
                                </svg>
                            `;
                        } else {
                            this.muteBtn.innerHTML = `
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                                </svg>
                            `;
                        }
                    }
                }
            }
            
            toggleVideo() {
                if (this.localStream) {
                    const videoTrack = this.localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        videoTrack.enabled = !videoTrack.enabled;
                        this.isVideoEnabled = videoTrack.enabled;
                        this.videoBtn.classList.toggle('disabled', !this.isVideoEnabled);
                        // Обновляем иконку камеры
                        if (this.isVideoEnabled) {
                            this.videoBtn.innerHTML = `
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                                </svg>
                            `;
                        } else {
                            this.videoBtn.innerHTML = `
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27l4.99 4.99L7 9.27v6.73c0 .55.45 1 1 1h6.73l2 2H4c-.55 0-1-.45-1-1V7c0-.55.45-1 1-1h1.73L3.27 2z"/>
                                </svg>
                            `;
                        }
                    }
                }
            }
            
            endCall() {
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                }
                if (this.connection) {
                    this.connection.close();
                }
                if (this.peer) {
                    this.peer.destroy();
                }
                
                this.localVideo.srcObject = null;
                this.remoteVideo.srcObject = null;
                this.isConnected = false;
                
                this.showWelcomeScreen();
                this.updateStatus('disconnected', 'Звонок завершен');
                this.showNotification('Звонок завершен', 'info');
            }
            
            updateStatus(type, text) {
                this.statusText.textContent = text;
                this.statusIndicator.className = `status-indicator ${type}`;
                
                if (type === 'connected') {
                    this.connectionInfo.style.display = 'block';
                    this.connectionText.textContent = 'Соединение активно';
                } else {
                    this.connectionInfo.style.display = 'none';
                }
            }
            
            showWelcomeScreen() {
                this.welcomeScreen.style.display = 'flex';
            }
            
            hideWelcomeScreen() {
                this.welcomeScreen.style.display = 'none';
            }
            
            showNotification(message, type = 'info') {
                this.notification.textContent = message;
                this.notification.className = `notification ${type} show`;
                
                setTimeout(() => {
                    this.notification.classList.remove('show');
                }, 3000);
            }
        }
        
        // Запускаем приложение
        new VideoCallApp();
    </script>
</body>
</html>
