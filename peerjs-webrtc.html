<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerJS WebRTC тест</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        video {
            width: 100%;
            max-width: 400px;
            height: 300px;
            background: #000;
            border-radius: 10px;
            margin: 10px;
        }
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .status {
            margin: 20px 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        input {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 PeerJS WebRTC тест</h1>
        <p>Тестируем WebRTC с PeerJS (без собственного сервера)</p>
        
        <div class="controls">
            <button id="startBtn">📹 Начать тест</button>
            <button id="stopBtn" disabled>⏹️ Остановить</button>
        </div>
        
        <div class="status" id="status">Готов к тестированию</div>
        
        <div class="video-container">
            <div>
                <h3>Локальное видео</h3>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div>
                <h3>Удаленное видео</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        class PeerJSWebRTCTest {
            constructor() {
                this.localStream = null;
                this.peer = null;
                this.connection = null;
                this.roomId = null;
                
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.status = document.getElementById('status');
                this.localVideo = document.getElementById('localVideo');
                this.remoteVideo = document.getElementById('remoteVideo');
                
                this.startBtn.onclick = () => this.startTest();
                this.stopBtn.onclick = () => this.stopTest();
            }
            
            async startTest() {
                try {
                    this.status.textContent = 'Запрашиваем доступ к камере...';
                    
                    // Получаем доступ к камере
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });
                    
                    this.localVideo.srcObject = this.localStream;
                    this.status.textContent = 'Камера включена, подключаемся к PeerJS...';
                    
                    // Создаем PeerJS соединение
                    this.roomId = 'peerjs-test-' + Math.random().toString(36).substr(2, 9);
                    this.peer = new Peer(this.roomId);
                    
                    this.peer.on('open', (id) => {
                        this.status.textContent = `PeerJS подключен! ID: ${id}`;
                        this.startBtn.disabled = true;
                        this.stopBtn.disabled = false;
                    });
                    
                    this.peer.on('call', (call) => {
                        this.status.textContent = 'Входящий звонок...';
                        call.answer(this.localStream);
                        call.on('stream', (remoteStream) => {
                            this.remoteVideo.srcObject = remoteStream;
                            this.status.textContent = 'WebRTC соединение установлено!';
                            
                            // Проверяем видео через 3 секунды
                            setTimeout(() => {
                                console.log('Проверка видео:');
                                console.log('- videoWidth:', this.remoteVideo.videoWidth);
                                console.log('- videoHeight:', this.remoteVideo.videoHeight);
                                console.log('- readyState:', this.remoteVideo.readyState);
                                console.log('- paused:', this.remoteVideo.paused);
                                
                                if (this.remoteVideo.videoWidth > 0 && this.remoteVideo.videoHeight > 0) {
                                    console.log('✅ Видео отображается!');
                                    this.status.textContent = '✅ Видео работает!';
                                } else {
                                    console.log('❌ Видео не отображается');
                                    this.status.textContent = '❌ Видео не отображается';
                                }
                            }, 3000);
                        });
                    });
                    
                    this.peer.on('error', (error) => {
                        console.error('PeerJS ошибка:', error);
                        this.status.textContent = 'Ошибка PeerJS: ' + error.message;
                    });
                    
                } catch (error) {
                    console.error('Ошибка:', error);
                    this.status.textContent = 'Ошибка: ' + error.message;
                }
            }
            
            stopTest() {
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                }
                if (this.connection) {
                    this.connection.close();
                }
                if (this.peer) {
                    this.peer.destroy();
                }
                
                this.localVideo.srcObject = null;
                this.remoteVideo.srcObject = null;
                
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.status.textContent = 'Тест остановлен';
            }
        }
        
        // Запускаем приложение
        new PeerJSWebRTCTest();
    </script>
</body>
</html>
